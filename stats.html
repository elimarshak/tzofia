<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://wpnbzpulkyogdeuuqffh.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF0EA">
<title>OPENEYE: נתוני הכניסות</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Heebo;src:url(fonts/Heebo.woff2) format("woff2"),url(fonts/Heebo.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{--bg:#EEF0EA;--panel:#FFFFFF;--ink:#16222E;--sub:#4A5866;--line:#D9DEE2;--accent:#0B4F8A;--warn:#A8195C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.06em}
.brand svg{width:22px;height:22px;color:var(--accent)}
h1{font-size:22px;font-weight:600;margin:4px 0 2px}
h2{font-size:17px;font-weight:600;margin:0 0 4px}
section{background:var(--panel);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 6px rgba(22,34,46,.08)}
.note{color:var(--sub);font-size:14px}
.big{font-size:18px;font-weight:500}
button{font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px;padding:0 16px}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
input{font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;width:100%;max-width:320px;background:#fff;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.scroll{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:center;padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--sub);font-size:13.5px}
td.label{text-align:start;font-weight:500}
td.label small{display:block;font-weight:400;color:var(--sub);font-size:12.5px;line-height:1.4}
td.num{font-variant-numeric:tabular-nums;font-weight:500;border-top:0;padding-top:2px}
tr.metric td{padding-bottom:2px}
small.sub{display:block;font-size:12px;color:var(--sub);font-weight:400}
.chart{margin-top:10px}
.chart svg{width:100%;height:auto;display:block}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,monospace;font-size:13px}
footer{color:var(--sub);font-size:12.5px;margin-top:20px}
footer a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><path d="M12 12 18.4 5.6"/><path d="M12 12 18.4 5.6A9 9 0 0 1 21 12Z" fill="currentColor" fill-opacity=".35" stroke="none"/><circle cx="15.8" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>OPENEYE</div>
    <button id="out" type="button" hidden>יציאה</button>
  </header>
  <h1>נתוני הכניסות לאתר</h1>

  <section id="login">
    <p>כדי לראות את הנתונים, צריך להקליד את הסיסמה של עמוד הנתונים.</p>
    <div class="row">
      <input id="key" type="password" autocomplete="current-password" aria-label="סיסמה">
      <button id="go" class="main" type="button">כניסה</button>
    </div>
    <p id="err" class="err" role="alert" hidden></p>
  </section>

  <div id="data" hidden></div>

  <footer>
    <p>המדינה והעיר של כל ביקור נקבעות לפי טבלת כתובות רשת ששמורה אצלנו, והטבלה מבוססת על המאגר של DB-IP:</p>
    <p><bdi><a href="https://db-ip.com" target="_blank" rel="noopener noreferrer">IP Geolocation by DB-IP</a></bdi></p>
    <p>האתר לא שומר כתובות רשת ולא שומר עוגיות.</p>
  </footer>
</main>
<script src="stats.js"></script>
</body>
</html>
