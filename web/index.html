<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gibs.earthdata.nasa.gov https://view.eumetsat.int; font-src 'self'; connect-src 'self' https://wpnbzpulkyogdeuuqffh.supabase.co https://gibs.earthdata.nasa.gov https://view.eumetsat.int https://raw.githubusercontent.com; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#C7D6E0">
<title>OPENEYE</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- the data server's connection and every code file are requested at once, instead of one after another -->
<link rel="preconnect" href="https://wpnbzpulkyogdeuuqffh.supabase.co" crossorigin>
<link rel="modulepreload" href="config.js">
<link rel="modulepreload" href="data.js">
<link rel="modulepreload" href="i18n.js">
<link rel="modulepreload" href="regions.js">
<link rel="modulepreload" href="app.js">
<script type="module" src="early.js" async></script>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map" role="application"></div>

<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><path d="M12 12 18.4 5.6"/><path d="M12 12 18.4 5.6A9 9 0 0 1 21 12Z" fill="currentColor" fill-opacity=".35" stroke="none"/><circle cx="15.8" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg></span><b id="brand-name">OPENEYE</b></div>
  <div class="btns">
    <button id="btn-search" class="btn icon" type="button" aria-expanded="false" aria-controls="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    </button>
    <button id="btn-layers" class="btn" type="button" aria-expanded="false" aria-controls="layers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/></svg>
      <span data-t="layers"></span>
    </button>
    <button id="btn-lang" class="btn" type="button"></button>
  </div>
</header>

<nav class="ctl" aria-label="map">
  <button id="btn-zin" class="cbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="btn-zout" class="cbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  <button id="btn-home" class="cbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button id="btn-info" class="cbtn" type="button" aria-controls="sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
</nav>
<section id="sources" class="pop small" hidden><h3 data-t="sources"></h3><ul class="srclist" id="sources-text"></ul></section>
<section id="search" class="pop" hidden>
  <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search">
  <div id="results"></div>
</section>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="maploading" class="maploading" role="status"><span data-t="mapLoading"></span></div>

<section id="layers" class="pop" hidden>
  <h3 data-t="mapLook"></h3>
  <label class="opt"><input type="radio" name="theme" value="dark"><span data-t="themeDark"></span></label>
  <label class="opt"><input type="radio" name="theme" value="light"><span data-t="themeLight"></span></label>
  <h3 data-t="layers"></h3>
  <label class="opt"><input type="checkbox" id="opt-ac" checked><span data-t="optAircraft"></span></label>
  <label class="opt"><input type="checkbox" id="opt-labels" checked><span data-t="optLabels"></span></label>
  <label class="opt"><input type="checkbox" id="opt-gnss" checked><span data-t="gnss"></span></label>
  <label class="opt"><input type="checkbox" id="opt-skies" checked><span data-t="skies"></span></label>
  <label class="opt"><input type="checkbox" id="opt-sats" checked><span data-t="sats"></span></label>
  <label class="opt"><input type="checkbox" id="opt-conj" checked><span data-t="conjs"></span></label>
  <label class="opt"><input type="checkbox" id="opt-ships" checked><span data-t="ships"></span></label>
  <label class="opt"><input type="checkbox" id="opt-quakes" checked><span data-t="quakes"></span></label>
  <label class="opt"><input type="checkbox" id="opt-fires" checked><span data-t="fires"></span></label>
  <label class="opt"><input type="checkbox" id="opt-outages" checked><span data-t="outages"></span></label>
  <h3 data-t="pushTitle"></h3>
  <label class="opt"><input type="checkbox" id="opt-push-skies"><span data-t="skies"></span></label>
  <p class="push-note" id="push-note" hidden></p>
  <h3 data-t="imgTitle"></h3>
  <label class="opt"><input type="radio" name="img" value="off" checked><span data-t="imgOff"></span></label>
  <label class="opt"><input type="radio" name="img" value="clouds"><span data-t="imgClouds"></span></label>
  <label class="opt"><input type="radio" name="img" value="d1"><span id="img-d1"></span></label>
  <label class="opt"><input type="radio" name="img" value="d0"><span id="img-d0"></span></label>
  <label class="opt"><input type="radio" name="img" value="sharp"><span data-t="imgSharp"></span></label>
</section>

<div class="bottom">
  <button class="legend" id="legend" type="button" aria-expanded="false"></button>
  <section class="sheet closed home" id="sheet">
    <button class="grip" id="grip" type="button"><i></i></button>
    <button class="xbtn" id="btn-close" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div id="sheet-body"></div>
    <p class="credit" id="credit"></p>
  </section>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/basemaps.js"></script>
<script src="basemap-info.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
