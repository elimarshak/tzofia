<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://wpnbzpulkyogdeuuqffh.supabase.co; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0D1822">
<title>צופיה</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map" role="application"></div>

<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true">צ</span><b id="brand-name">צופיה</b></div>
  <div class="btns">
    <button id="btn-layers" class="btn" type="button" aria-expanded="false" aria-controls="layers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/></svg>
      <span data-t="layers"></span>
    </button>
    <button id="btn-lang" class="btn" type="button"></button>
  </div>
</header>

<section id="layers" class="pop" hidden>
  <h3 data-t="layers"></h3>
  <label class="opt"><input type="checkbox" id="opt-ac" checked><span data-t="optAircraft"></span></label>
  <label class="opt"><input type="checkbox" id="opt-labels" checked><span data-t="optLabels"></span></label>
  <h3 data-t="mapLook"></h3>
  <label class="opt"><input type="radio" name="theme" value="dark"><span data-t="themeDark"></span></label>
  <label class="opt"><input type="radio" name="theme" value="light"><span data-t="themeLight"></span></label>
</section>

<div class="bottom">
  <div class="legend" id="legend"></div>
  <section class="sheet" id="sheet">
    <button class="grip" id="grip" type="button"><i></i></button>
    <div id="sheet-body"></div>
    <p class="credit" id="credit"></p>
  </section>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/basemaps.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
