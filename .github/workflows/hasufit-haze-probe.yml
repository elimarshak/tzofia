name: hasufit-haze-probe
# one-off on the temporary branch hasufit-haze-probe (22.11.2026): save the OpenStreetMap answers of every point,
# including the places of the corner square, so the weekly run no longer has to ask Overpass every Sunday
on:
  push:
    branches: [hasufit-haze-probe]
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - shell: bash
        run: |
          set -uo pipefail
          pip install -q rasterio==1.4.3 numpy pillow pyproj scipy
          for p in majdal-hadar jubata quneitra maariya khiam-hamames markaba-houla aitaroun-jaldeir ramiya labbouneh beaufort; do
            for try in 1 2 3 4; do
              echo "[$p] attempt $try"
              timeout 1500 python tools/hasufit/fetch_point.py tools/hasufit/points/$p.json raw/$p > /dev/null && break
              sleep 120
            done
            [ -f raw/$p/osm.json ] && cp raw/$p/osm.json tools/hasufit/points/$p.osm.json && echo "[$p] saved"
          done
          git config user.name tzofia-build; git config user.email noreply@github.com
          git add tools/hasufit/points/*.osm.json
          git commit -q -m "hasufit: OpenStreetMap answers of the corner squares, saved with the points [skip ci]" && git push -q origin HEAD:hasufit-haze-probe
