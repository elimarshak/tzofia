name: hasufit-probe
# Temporary: fetches the 'חשופית' points in tools/hasufit/points and puts the results on the hasufit-out branch.
on:
  push:
    branches: [hasufit-probe]
concurrency: { group: hasufit-probe, cancel-in-progress: true }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - shell: bash
        run: |
          set +e
          mkdir out
          pip install -q rasterio==1.4.3 numpy pillow pyproj > out/pip.txt 2>&1
          curl -fsSL -A "openeye.co.il" -o out/logo.png https://civilpress.co.il/wp-content/uploads/2020/06/logo_itonut.png
          bash tools/hasufit/probe_vhr.sh > out/vhr.txt 2>&1
          [ -f tools/hasufit/run-points ] && for p in tools/hasufit/points/[!.]*[!m].json; do
            n=$(basename "$p" .json); mkdir -p "out/$n"
            for try in 1 2 3; do
              python tools/hasufit/fetch_point.py "$p" "out/$n" >> "out/$n/run.txt" 2>&1 && break
              echo "attempt $try failed, waiting" >> "out/$n/run.txt"; sleep 120
            done
          done
          cd out && git init -q -b hasufit-out && git add -A
          git -c user.name="tzofia-build" -c user.email="noreply@github.com" commit -q -m "hasufit $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" hasufit-out > /tmp/push.txt 2>&1 || echo "::error::push failed: $(tr '\n' ' ' < /tmp/push.txt | cut -c1-900)"
          echo "::notice::vhr: $(tr '\n' ' ' < vhr.txt | cut -c1-3000)"
          for f in */run.txt; do echo "::notice::$f: $(tail -c 700 $f | tr '\n' ' ')"; done
          exit 0
